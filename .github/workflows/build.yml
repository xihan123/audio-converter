name: Build Release

on:
  push:
    branches: [ main, master ]
    tags:
    - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always

jobs:
  download-ffmpeg:
    name: Download FFmpeg
    runs-on: ubuntu-latest
    outputs:
      ffmpeg-version: ${{ steps.get-version.outputs.version }}

    steps:
    - name: Get latest FFmpeg release
      id: get-version
      run: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/xihan123/FFmpeg-Audio/releases/latest | jq -r .tag_name)
        echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest FFmpeg version: $LATEST_TAG"

    - name: Download FFmpeg
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        curl -L -o ffmpeg-audio.zip "https://github.com/xihan123/FFmpeg-Audio/releases/download/${VERSION}/ffmpeg-audio-only-${VERSION}-windows-x64.zip"
        echo "Downloaded FFmpeg version ${VERSION}"

    - name: Extract FFmpeg
      run: |
        unzip -o ffmpeg-audio.zip
        echo "Contents of extracted archive:"
        ls -lhR
        echo "Looking for bin directory..."
        find . -name "bin" -type d
        echo "Looking for ffmpeg executables..."
        find . -name "ffmpeg.exe" -o -name "ffprobe.exe"

    - name: Copy FFmpeg binaries
      run: |
        # FFmpeg 可执行文件在 bin 子目录中
        if [ -d "bin" ]; then
          cp bin/ffmpeg.exe .
          cp bin/ffprobe.exe .
        else
          # 尝试查找并复制
          find . -name "ffmpeg.exe" -exec cp {} . \;
          find . -name "ffprobe.exe" -exec cp {} . \;
        fi
        echo "Copied files:"
        ls -lh ffmpeg.exe ffprobe.exe

    - name: Upload FFmpeg artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-binaries
        path: |
          ffmpeg.exe
          ffprobe.exe
        retention-days: 1

  build:
    name: Build - ${{ matrix.platform.name }}
    needs: download-ffmpeg
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - name: Windows x86_64
          os: windows-latest
          target: x86_64-pc-windows-msvc
          artifact: audio-converter-windows-x86_64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.platform.target }}
        cache: true

    - name: Download FFmpeg binaries
      uses: actions/download-artifact@v4
      with:
        name: ffmpeg-binaries
        path: .

    - name: Verify FFmpeg files
      shell: pwsh
      run: |
        Write-Host "Checking FFmpeg files..."
        if (Test-Path "ffmpeg.exe") {
          Write-Host "✓ ffmpeg.exe found"
          (Get-Item "ffmpeg.exe").Length
        } else {
          Write-Host "✗ ffmpeg.exe not found"
          exit 1
        }
        if (Test-Path "ffprobe.exe") {
          Write-Host "✓ ffprobe.exe found"
          (Get-Item "ffprobe.exe").Length
        } else {
          Write-Host "✗ ffprobe.exe not found"
          exit 1
        }

    - name: Build release
      run: cargo build --release --target ${{ matrix.platform.target }}

    - name: Prepare release package
      shell: pwsh
      run: |
        $releaseDir = "release-package"
        New-Item -ItemType Directory -Force -Path $releaseDir

        # 复制可执行文件
        Copy-Item "target/${{ matrix.platform.target }}/release/audio-converter.exe" $releaseDir/

        # 复制 FFmpeg 工具
        Copy-Item "ffmpeg.exe" $releaseDir/
        Copy-Item "ffprobe.exe" $releaseDir/

        # 复制字体文件
        Copy-Item "SimHei.ttf" $releaseDir/

        # 创建 README
        @"
        # Audio Converter

        音频格式转换工具 - Windows Release

        ## 包含文件
        - audio-converter.exe: 主程序
        - ffmpeg.exe: FFmpeg 工具 (版本: ${{ needs.download-ffmpeg.outputs.ffmpeg-version }})
        - ffprobe.exe: FFprobe 工具
        - SimHei.ttf: 中文字体文件

        ## 使用方法
        双击 audio-converter.exe 启动程序

        ## 系统要求
        - Windows 10/11 x64
        - .NET Framework 4.7.2 或更高版本 (通常已预装)

        构建时间: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
        "@ | Out-File -FilePath "$releaseDir/README.txt" -Encoding UTF8

        # 创建压缩包
        Compress-Archive -Path "$releaseDir/*" -DestinationPath "${{ matrix.platform.artifact }}"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.name }}
        path: ${{ matrix.platform.artifact }}
        retention-days: 7

    - name: Calculate checksums
      shell: pwsh
      run: |
        $hash = (Get-FileHash "${{ matrix.platform.artifact }}" -Algorithm SHA256).Hash
        "$hash  ${{ matrix.platform.artifact }}" | Out-File -FilePath "checksums.txt" -Encoding UTF8
        Get-Content checksums.txt

    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums-${{ matrix.platform.name }}
        path: checksums.txt

  release:
    name: Create Release
    needs: [ download-ffmpeg, build ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -name "*.zip" -exec cp {} release-files/ \;
        find artifacts -name "checksums.txt" -exec cat {} \; > release-files/SHA256SUMS.txt
        ls -lh release-files/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-files/*
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🎵 Audio Converter ${{ github.ref_name }}

          ### FFmpeg 版本
          使用 FFmpeg-Audio ${{ needs.download-ffmpeg.outputs.ffmpeg-version }}

          ### 下载说明
          - **Windows x64**: `audio-converter-windows-x86_64.zip`
          - 校验和文件: `SHA256SUMS.txt`

          ### 安装步骤
          1. 下载对应平台的 zip 文件
          2. 解压到任意目录
          3. 运行 `audio-converter.exe`

          ### 功能特性
          - ✨ 图形化界面，支持中文
          - 🎵 支持多种音频格式转换
          - 📁 批量文件处理
          - 🚀 基于精简版 FFmpeg，体积小巧

          ---
          构建时间: ${{ github.event.head_commit.timestamp }}
