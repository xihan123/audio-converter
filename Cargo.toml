[package]
name = "audio-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.28"
egui = "0.28"
tokio = { version = "1.47", features = ["full"] }
anyhow = "1.0"
walkdir = "2.5"
egui_extras = "0.28"
rfd = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# No build script needed, we'll use include_bytes! directly
